name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VULN_VERSION: v1.9.0
  # The runner image ships an older shellcheck that disagrees with current
  # releases, so the lint step installs this version and checks its digest.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  # Formatting, lint and vulnerability checks don't need a stick or macOS, so they run once on cheap Linux.
  # The package still has to compile there for lint and govulncheck to type-check it, hence libudev-dev.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go-blinkstick talks HID through github.com/sstallion/go-hid, which is
      # cgo and links libudev on Linux (#cgo linux LDFLAGS: -ludev -lrt).
      # Without the headers the package will not compile, so lint and
      # govulncheck would fail before they checked anything.
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" scripts/*.sh

      - name: Check formatting (gofmt -s)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with a Go at least as new as the setup-go version
          # above, or it cannot type-check the standard library. Bump it
          # with Go. Dependabot does not track this input.
          version: v2.15.0
          args: --timeout=5m

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.VULN_VERSION }} ./...

  # Runs the race-detector suite with coverage on macOS, the only platform go-blinkstick supports today.
  # The suite uses fakes so no stick is needed. Coverage is uploaded from the 1.26.x leg only.
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race detector, coverage)
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        if: matrix.go == '1.26.x'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  # macOS: go-blinkstick does not support Linux yet. With no stick attached the hardware tests skip.
  integration:
    name: Integration tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Run integration tests
        run: go test -tags integration -v ./test/integration/...

  # Builds through the Makefile, which owns the ldflags, and smoke-tests the binary on macOS where the
  # cgo HID link against IOKit is the one users actually run. Full history so git describe finds tags.
  build:
    name: Build and smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build blinky binary
        run: make build

      - name: CLI smoke test (blinky version)
        run: |
          output=$(./bin/blinky version)
          echo "$output"
          if ! echo "$output" | head -1 | grep -q '^blinky '; then
            echo "Smoke test failed: 'blinky version' did not print build identity"
            exit 1
          fi
