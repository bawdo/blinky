name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 26.1, Omarchy, Ubuntu 26.04
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Stick model
      options:
        - BlinkStick Nano
        - BlinkStick Square
        - Other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of blinky version
      render: text
    validations:
      required: true
  - type: textarea
    id: list
    attributes:
      label: Output of blinky list
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error output, the exit code, or anything else that seems relevant.
